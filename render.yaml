services:
  - type: web
    name: edutrack-lite-backend
    env: java
    region: oregon
    plan: free
    buildCommand: "cd backend && ./mvnw clean package -DskipTests || cd backend && mvn clean package -DskipTests"
    startCommand: "java -jar -Dspring.profiles.active=prod backend/target/edutrack-backend-1.0.0.jar"
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false