# ========================================================
# EduTrack Lite - Production Configuration (Neon PostgreSQL)
# Safe, non-destructive schema initialization
# ========================================================
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# Safe schema initialization on startup (never drops or reseeds)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-postgres.sql
spring.sql.init.continue-on-error=true

# Session & Cookie Management
server.servlet.session.timeout=120m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# Logging
logging.level.com.edutrack=INFO
logging.level.org.springframework.jdbc=WARN